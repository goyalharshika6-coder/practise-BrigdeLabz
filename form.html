<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
    body{
        background-color:#f2f2f2;
    }
    form{
        width:300px;
        height:400px;
        border:1px solid white;
        border-radius:10px;
        margin:30px auto;
        background-color: burlywood;
    }
    h1{
        text-align:center;
        font-family:sans-serif;
    }
    input,select{
        border:1px solid white;
        border-radius:2px;
        width:100%;
        padding:10px;
    }
    input[type="radio"],input[type="checkbox"]{
        width: auto;
    }
    .form-container {
    width:400px;
    border:1px solid white;
    border-radius:10px;
    margin:50px auto;
    padding:30px;
}
   button {
    width:60%;
    display:block;
    margin:20px auto;
    cursor:pointer;
    background-color: rgb(151, 219, 221);
}
    iframe{
        display: block;
        margin:30px auto;
    }
    #fullname{
        border:1px solid #ddd;
        border-radius:2px;
        width:100%
    }
    *{
        font-size: large;
    }

    </style>
</head>
<body>
    <h1>Student Registration Portal</h1>
    <form action="/register" method="post" class="form-container">
        <p>
        <label for="fullname">Full name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter name">
        </p>
        <p>
        <label for="email">University Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required>
        </p>
        <p>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age">
        </p>
        <p>
        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="DOB">
        </p>
        <p>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        </p>
        <p>
        <label for="skills">Skills:</label>
       <input type="checkbox" id="java" name="skills" value="java">
       <label for="java">Java</label>
       <input type="checkbox" id="python" name="skills"value="python">
       <label for="python">Python</label>
       </p>
        <p>
        <button type="submit">Submit</button>
        </p>
    </form>
       <p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3535.625363952711!2d77.58982927417848!3d27.605142229994144!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39736d000b437c71%3A0xf7336acc00b9baf0!2sGLA%20University%20Main%20Gate!5e0!3m2!1sen!2sin!4v1787139272636!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
       </p>
       <p>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/HcOc7P5BMi4?si=FFEiHdjzMnCNGj8C" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
       </p>
</body>
</html>
