<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

<div class="card-container">

    <div class="card">

        <div class="front">
            <img src="https://picsum.photos/300/200" alt="Nature">
            <h2>Nature</h2>
        </div>

        <div class="back">
            <h2>About Nature</h2>
            <p>
                Nature includes plants, animals, mountains,
                rivers and all living things around us.
            </p>
        </div>

    </div>

</div>

</body>
</html>
